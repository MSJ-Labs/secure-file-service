spring.application.name=secure-file-service

# 8082 and not 8080: that port belongs to trading-core on the same machine.
server.port=${SERVER_PORT:8082}

# Blocking I/O per request is cheap on virtual threads (see ARCHITECTURE.md).
spring.threads.virtual.enabled=true

# --- PostgreSQL --------------------------------------------------------------
# Credentials have no default on purpose: nothing secret lives in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/training}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- Flyway: the only place where the schema is created or altered ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Upload ------------------------------------------------------------------
# The standard multipart resolver would spool the whole body to memory or disk.
# The upload endpoint reads the servlet input stream directly instead.
spring.servlet.multipart.enabled=false
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:2147483648}
# An upload may stay UPLOADING for base-delay plus size / min-bytes-per-second. Working hypotheses, to calibrate.
app.upload.base-delay=${UPLOAD_BASE_DELAY:60s}
app.upload.min-bytes-per-second=${UPLOAD_MIN_BYTES_PER_SECOND:1048576}

# --- S3 (LocalStack in dev, real S3 by configuration) ---------------------------
# Real S3: leave S3_ENDPOINT empty, set S3_PATH_STYLE=false and the real region.
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:4566}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.path-style-access=${S3_PATH_STYLE:true}
app.storage.s3.quarantine-bucket=${S3_QUARANTINE_BUCKET:quarantine}
app.storage.s3.clean-bucket=${S3_CLEAN_BUCKET:clean}
# Memory per in-flight upload is roughly part size x 1-2. S3 minimum is 5 MiB, maximum 10,000 parts per upload.
app.storage.s3.part-size-bytes=${S3_PART_SIZE_BYTES:16777216}

# --- ClamAV ------------------------------------------------------------------
app.scanner.clamav.host=${CLAMAV_HOST:localhost}
app.scanner.clamav.port=${CLAMAV_PORT:3310}
app.scanner.clamav.connect-timeout=${CLAMAV_CONNECT_TIMEOUT:5s}
app.scanner.clamav.read-timeout=${CLAMAV_READ_TIMEOUT:10m}

# --- Scan queues and retries -------------------------------------------------
# Working hypotheses, to calibrate with a load test. Files up to small-max-bytes go to the SMALL queue, the others to
# LARGE. A failed scan is retried with a doubling backoff from base to max, until max-attempts failures.
app.scan.small-max-bytes=${SCAN_SMALL_MAX_BYTES:52428800}
app.scan.max-attempts=${SCAN_MAX_ATTEMPTS:3}
app.scan.base-backoff=${SCAN_BASE_BACKOFF:30s}
app.scan.max-backoff=${SCAN_MAX_BACKOFF:10m}

# --- Scan workers ------------------------------------------------------------
# One polling loop per queue, each scan on its own virtual thread, at most `slots` scans at a time per queue. The lease
# is how long a job stays owned by a worker that stops answering; it must outlast the longest scan. An empty queue is
# polled with a delay that doubles from poll-min-delay to poll-max-delay. Working hypotheses, to calibrate with a load test.
app.worker.enabled=${WORKER_ENABLED:true}
app.worker.small-slots=${WORKER_SMALL_SLOTS:8}
app.worker.large-slots=${WORKER_LARGE_SLOTS:2}
app.worker.lease=${WORKER_LEASE:10m}
app.worker.poll-min-delay=${WORKER_POLL_MIN_DELAY:500ms}
app.worker.poll-max-delay=${WORKER_POLL_MAX_DELAY:5s}
app.worker.scanner-unavailable-delay=${WORKER_SCANNER_UNAVAILABLE_DELAY:60s}
app.worker.maintenance-interval=${WORKER_MAINTENANCE_INTERVAL:30s}
app.worker.maintenance-batch-size=${WORKER_MAINTENANCE_BATCH_SIZE:100}

# --- Actuator: health only (compose healthcheck) -----------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# --- Keycloak (OAuth2 resource server) ----------------------------------------
# The realm is provisioned by Terraform (repo trading-infra). The issuer must match the token's "iss" character by
# character. The keys are read lazily from the fixed JWKS path, so the app starts while Keycloak is down.
app.security.oauth2.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/secure-file}
app.security.oauth2.jwks-path=${KEYCLOAK_JWKS_PATH:/protocol/openid-connect/certs}
# Only when the app cannot reach the issuer URL (Docker network): overrides issuer-uri + jwks-path for the key download.
app.security.oauth2.jwks-uri=${KEYCLOAK_JWKS_URI:}
app.security.oauth2.audience=${KEYCLOAK_AUDIENCE:secure-file-service}

# Swagger UI login (dev only): Authorization Code + PKCE with the public Keycloak client secure-file-dev-tools
springdoc.swagger-ui.oauth.client-id=secure-file-dev-tools
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid

# --- Errors ------------------------------------------------------------------
spring.mvc.problem-details.enabled=true

# --- Logging -----------------------------------------------------------------
logging.level.com.msj.securefile=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
