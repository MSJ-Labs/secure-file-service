name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests, integration tests (Testcontainers, Docker is available on the runner) and the 80% coverage gate.
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Also uploaded when the build fails, which is when the report is most useful (for example, the coverage gate).
      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn
