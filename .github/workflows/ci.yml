name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANALYZE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud needs the full history to attribute new code
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Unit tests, integration tests (Testcontainers, Docker is available on the runner) and the 80% coverage gate.
      # SonarCloud analysis runs in the same build (one test run, not two), only for pushes to main and pull requests
      # into main. Pull requests from forks do not get the SONAR_TOKEN secret: they, and every other branch, run the
      # build alone.
      - name: Build, test and analyze
        if: ${{ env.ANALYZE == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress verify sonar:sonar

      - name: Build and test
        if: ${{ env.ANALYZE != 'true' }}
        run: mvn --batch-mode --no-transfer-progress verify

      # Also uploaded when the build fails, which is when the report is most useful (for example, the coverage gate).
      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn
